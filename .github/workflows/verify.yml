name: Verify source

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Check source export safety
        run: ./scripts/Test-SourcePackaging.ps1
      - name: Verify portable launcher
        run: ./scripts/Test-Launcher.ps1
      - name: Verify runtime contract fixtures
        run: ./scripts/Test-RuntimeContract.ps1
      - name: Restore with transitive vulnerability audit
        run: >-
          dotnet restore tests/CodexUsageWidget.Tests/CodexUsageWidget.Tests.csproj
          -p:ContinuousIntegrationBuild=true -p:NuGetAudit=true -p:NuGetAuditMode=all
      - name: Run full test suite
        run: >-
          dotnet test tests/CodexUsageWidget.Tests/CodexUsageWidget.Tests.csproj
          -c Release --no-restore --nologo -p:ContinuousIntegrationBuild=true
      - name: Build review-only runtime
        run: >-
          dotnet publish CodexUsageWidget.csproj -c Release -r win-x64
          --self-contained false -p:UseAppHost=false -o bin/review-build
          -p:ContinuousIntegrationBuild=true
      - name: Verify no-network build diagnostic and inventory
        run: ./scripts/Test-Diagnostics.ps1 -PublishPath bin/review-build
      - name: Verify Windows release package contract
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $icon = Join-Path $PWD.Path 'Assets\mali-yaya.ico'
          $launcherSource = Join-Path $PWD.Path 'launcher\WidgetLauncher.cs'
          $launcher = Join-Path $PWD.Path 'bin\review-build\CodexUsageWidget.exe'
          & $csc /nologo /codepage:65001 /target:winexe /platform:x64 /reference:System.Windows.Forms.dll /win32icon:$icon /out:$launcher $launcherSource
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed.' }
          ./scripts/Test-Icon.ps1 -Launcher $launcher
          $source = [IO.File]::ReadAllText((Join-Path $PWD 'WidgetRuntimeStatus.cs'))
          $version = [regex]::Match($source, 'BuildVersion = "([0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{1,4})"').Groups[1].Value
          if (-not $version) { throw 'Missing source build version.' }
          ./scripts/Test-ReleasePackage.ps1 -PublishPath bin/review-build -Version $version

name: Verify private source

# Manual-only: do not automatically consume private-repository Actions minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'
      - name: Check source export safety
        shell: powershell
        run: ./scripts/Test-SourcePackaging.ps1
      - name: Verify portable launcher
        shell: powershell
        run: ./scripts/Test-Launcher.ps1
      - name: Restore with transitive vulnerability audit
        shell: pwsh
        run: >-
          dotnet restore tests/CodexUsageWidget.Tests/CodexUsageWidget.Tests.csproj
          -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test tests/CodexUsageWidget.Tests/CodexUsageWidget.Tests.csproj -c Release --no-restore --nologo
      - name: Build review-only runtime
        shell: pwsh
        run: >-
          dotnet publish CodexUsageWidget.csproj -c Release -r win-x64
          --self-contained false -p:UseAppHost=false -o bin/review-build
          -p:ContinuousIntegrationBuild=true
      - name: Verify diagnostic has no GUI side effects
        shell: powershell
        run: ./scripts/Test-Diagnostics.ps1 -PublishPath bin/review-build
      - name: Verify Windows release package contract
        shell: powershell
        run: |
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /codepage:65001 /target:winexe /platform:x64 /reference:System.Windows.Forms.dll /win32icon:Assets/mali-yaya.ico /out:bin/review-build/CodexUsageWidget.exe launcher/WidgetLauncher.cs
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed.' }
          ./scripts/Test-Icon.ps1 -Launcher bin/review-build/CodexUsageWidget.exe
          $source = [IO.File]::ReadAllText((Join-Path $PWD 'WidgetRuntimeStatus.cs'))
          $version = [regex]::Match($source, 'BuildVersion = "([0-9.]+)"').Groups[1].Value
          ./scripts/Test-ReleasePackage.ps1 -PublishPath bin/review-build -Version $version
